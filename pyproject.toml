[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tennis-alpha-engine"
version = "0.1.0"
description = "Research-first, risk-gated tennis prediction-market trading engine for Polymarket US."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "numpy>=1.26",
    "scipy>=1.13",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
# The live extra is intentionally separate: record and paper installs never
# need the order-capable SDK.
live = ["polymarket-us>=2.4,<3"]
ws = ["websockets>=13.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
tennis-alpha = "tennis_alpha.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tennis_alpha"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
    "network: hits the real public Polymarket US API (skipped unless TA_NETWORK_TESTS=1)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]

[tool.mypy]
python_version = "3.12"
packages = ["tennis_alpha"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
